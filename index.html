<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nòmines</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1d5d8c">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1d5d8c;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  main{display:grid;gap:18px;justify-items:center;max-width:340px}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:0;font-size:1.4rem;font-weight:600}
  .btn{display:inline-block;background:#fff;color:#1d5d8c;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px;border:0;font-size:1rem}
  .alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
  p{margin:0;opacity:.9;font-size:.92rem}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>Les meves nòmines</h1>
  <button class="btn alt" id="install" hidden>Instal·la l'app</button>
  <p id="help">Per tenir-la com una app: menú ⋮ del Chrome → «Afegeix a la pantalla d'inici».</p>
  <a class="btn" href="https://claude.ai/artifact/H5KeS8MekvG4R6KoXLfnzJ">Obre el tauler</a>
</main>
<script>
  const TAULER = 'https://claude.ai/artifact/H5KeS8MekvG4R6KoXLfnzJ';
  // Obert des de la icona instal·lada: salta directament al tauler.
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone || /[?&]app=1/.test(location.search)) location.replace(TAULER);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let prompt;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; document.getElementById('install').hidden = false; });
  document.getElementById('install').onclick = async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; document.getElementById('install').hidden = true; };
  addEventListener('appinstalled', () => { document.getElementById('help').textContent = 'Instal·lada! Ja la tens a la pantalla d\'inici.'; });
</script>
</body>
</html>
